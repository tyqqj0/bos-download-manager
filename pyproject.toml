[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dlm"
version = "2.0.0"
description = "Dataset download manager — Celery + Redis task queue with multi-server workers"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "python-dotenv>=1.0",
    "bce-python-sdk>=0.9",
    "pyyaml>=6.0",
    "huggingface_hub>=0.20",
    "celery[redis]>=5.3",
    "redis>=5.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.100", "uvicorn>=0.20"]
transfer = ["pycryptodome>=3.18", "requests>=2.28"]

[project.scripts]
dlm = "dlm.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["dlm*"]
