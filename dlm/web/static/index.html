<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLM Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .progress-bar { transition: width 0.5s ease; }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen" x-data="app()" x-init="init()">

<!-- Top Nav -->
<nav class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-4">
        <h1 class="text-xl font-bold text-white">DLM Dashboard</h1>
        <span class="text-xs text-gray-400" x-text="lastSync"></span>
    </div>
    <div class="flex items-center gap-2">
        <button @click="triggerSync()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 rounded text-sm font-medium">
            Sync
        </button>
        <button @click="showAddModal = true" class="px-3 py-1.5 bg-green-600 hover:bg-green-700 rounded text-sm font-medium">
            + Add
        </button>
    </div>
</nav>

<div class="flex">
    <!-- Sidebar -->
    <aside class="w-48 bg-gray-800 border-r border-gray-700 min-h-[calc(100vh-52px)] p-4">
        <nav class="space-y-1">
            <button @click="view = 'dashboard'" :class="view === 'dashboard' ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-white'" class="w-full text-left px-3 py-2 rounded text-sm">
                Dashboard
            </button>
            <button @click="view = 'tasks'" :class="view === 'tasks' ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-white'" class="w-full text-left px-3 py-2 rounded text-sm">
                Tasks
            </button>
            <button @click="view = 'servers'" :class="view === 'servers' ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-white'" class="w-full text-left px-3 py-2 rounded text-sm">
                Servers
            </button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">

        <!-- Dashboard View -->
        <div x-show="view === 'dashboard'" x-cloak>
            <!-- Progress Bar -->
            <div class="bg-gray-800 rounded-lg p-4 mb-6">
                <div class="flex justify-between mb-2">
                    <span class="text-sm text-gray-400">Total Progress</span>
                    <span class="text-sm font-mono" x-text="`${dashboard.total_downloaded_tb || 0} TB / ${dashboard.total_estimated_tb || 0} TB`"></span>
                </div>
                <div class="w-full bg-gray-700 rounded-full h-4">
                    <div class="bg-blue-500 h-4 rounded-full progress-bar" :style="`width: ${progressPct}%`"></div>
                </div>
                <div class="flex justify-between mt-2 text-xs text-gray-500">
                    <span x-text="`${dashboard.total_tasks || 0} tasks total`"></span>
                    <span x-text="`${progressPct}%`"></span>
                </div>
            </div>

            <!-- Status Summary -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-gray-800 rounded-lg p-4">
                    <div class="text-2xl font-bold text-green-400" x-text="dashboard.by_status?.done || 0"></div>
                    <div class="text-xs text-gray-400">Done</div>
                </div>
                <div class="bg-gray-800 rounded-lg p-4">
                    <div class="text-2xl font-bold text-blue-400" x-text="dashboard.by_status?.downloading || 0"></div>
                    <div class="text-xs text-gray-400">Downloading</div>
                </div>
                <div class="bg-gray-800 rounded-lg p-4">
                    <div class="text-2xl font-bold text-yellow-400" x-text="(dashboard.by_status?.queued || 0) + (dashboard.by_status?.dispatched || 0)"></div>
                    <div class="text-xs text-gray-400">Queued</div>
                </div>
                <div class="bg-gray-800 rounded-lg p-4">
                    <div class="text-2xl font-bold text-red-400" x-text="dashboard.by_status?.failed || 0"></div>
                    <div class="text-xs text-gray-400">Failed</div>
                </div>
            </div>

            <!-- Server Cards -->
            <h3 class="text-sm font-medium text-gray-400 mb-3">Servers</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
                <template x-for="(srv, key) in (dashboard.servers || {})" :key="key">
                    <div class="bg-gray-800 rounded-lg p-3 cursor-pointer hover:bg-gray-750 border border-gray-700"
                         :class="srv.worker_alive ? 'border-green-800' : 'border-red-800'"
                         @click="view = 'servers'; selectedServer = key">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="w-2 h-2 rounded-full" :class="srv.worker_alive ? 'bg-green-400' : 'bg-red-400'"></span>
                            <span class="font-medium text-sm" x-text="key"></span>
                            <span class="text-xs text-cyan-400 ml-auto" x-show="getSpeed(key) > 0" x-text="formatSpeed(getSpeed(key))"></span>
                        </div>
                        <div class="text-xs text-gray-400 truncate" x-text="srv.current_task ? extractRepo(srv.current_task) : (srv.active_tasks?.length ? 'working...' : 'idle')"></div>
                        <div class="text-xs text-gray-500" x-text="`${srv.active_tasks?.length || 0} tasks`"></div>
                    </div>
                </template>
            </div>

            <!-- Recent Activity -->
            <h3 class="text-sm font-medium text-gray-400 mb-3">Recent Activity</h3>
            <div class="bg-gray-800 rounded-lg divide-y divide-gray-700">
                <template x-for="t in (dashboard.recent_activity || [])" :key="t.id">
                    <div class="px-4 py-2 flex items-center gap-3">
                        <span class="text-sm" :class="t.status === 'done' ? 'text-green-400' : 'text-red-400'" x-text="t.status === 'done' ? '&#10003;' : '&#10007;'"></span>
                        <span class="text-sm flex-1" x-text="t.name"></span>
                        <span class="text-xs text-gray-500" x-text="t.server || '-'"></span>
                        <span class="text-xs text-gray-500" x-text="timeAgo(t.completed_at)"></span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Tasks View -->
        <div x-show="view === 'tasks'" x-cloak>
            <!-- Filters -->
            <div class="flex flex-wrap gap-3 mb-4 items-center">
                <select x-model="filters.status" class="bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-sm">
                    <option value="">All Status</option>
                    <option value="downloading">Downloading</option>
                    <option value="dispatched">Dispatched</option>
                    <option value="queued">Queued</option>
                    <option value="failed">Failed</option>
                    <option value="done">Done</option>
                </select>
                <select x-model="filters.server" class="bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-sm">
                    <option value="">All Servers</option>
                    <template x-for="key in serverKeys" :key="key">
                        <option :value="key" x-text="key"></option>
                    </template>
                </select>
                <select x-model="filters.category" class="bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-sm">
                    <option value="">All Categories</option>
                    <template x-for="c in categories" :key="c">
                        <option :value="c" x-text="c"></option>
                    </template>
                </select>
                <input x-model="filters.search" type="text" placeholder="Search..."
                       class="bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-sm w-48">
                <span class="text-xs text-gray-500 ml-auto" x-text="`${filteredTasks.length} tasks`"></span>
            </div>

            <!-- Task Table -->
            <div class="bg-gray-800 rounded-lg overflow-hidden">
                <table class="w-full text-sm">
                    <thead class="bg-gray-750 text-gray-400 text-xs uppercase">
                        <tr>
                            <th class="px-4 py-2 text-left w-8"><input type="checkbox" x-model="selectAll" @change="toggleSelectAll()"></th>
                            <th class="px-4 py-2 text-left cursor-pointer" @click="toggleSort('name')">Name</th>
                            <th class="px-4 py-2 text-left cursor-pointer" @click="toggleSort('status')">Status</th>
                            <th class="px-4 py-2 text-left cursor-pointer" @click="toggleSort('server')">Server</th>
                            <th class="px-4 py-2 text-left cursor-pointer" @click="toggleSort('size')">Progress</th>
                            <th class="px-4 py-2 text-left">Category</th>
                            <th class="px-4 py-2 text-left">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-700">
                        <template x-for="t in filteredTasks" :key="t.id">
                            <tr class="hover:bg-gray-750">
                                <td class="px-4 py-2"><input type="checkbox" :value="t.id" x-model="selectedTasks"></td>
                                <td class="px-4 py-2">
                                    <div class="font-medium" x-text="t.name"></div>
                                    <div class="text-xs text-gray-500" x-text="t.repo_id"></div>
                                </td>
                                <td class="px-4 py-2">
                                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium"
                                          :class="statusClass(t.status)">
                                        <span x-text="statusIcon(t.status)"></span>
                                        <span x-text="t.status"></span>
                                    </span>
                                </td>
                                <td class="px-4 py-2 text-gray-400" x-text="t.server || '-'"></td>
                                <td class="px-4 py-2">
                                    <div class="flex items-center gap-2">
                                        <div class="w-20 bg-gray-700 rounded-full h-2">
                                            <div class="h-2 rounded-full progress-bar"
                                                 :class="t.status === 'done' ? 'bg-green-500' : 'bg-blue-500'"
                                                 :style="`width: ${taskProgress(t)}%`"></div>
                                        </div>
                                        <span class="text-xs text-gray-400" x-text="formatSize(t)"></span>
                                        <span x-show="getTaskSpeed(t) > 0" class="text-xs text-cyan-400" x-text="formatSpeed(getTaskSpeed(t))"></span>
                                    </div>
                                </td>
                                <td class="px-4 py-2 text-gray-400 text-xs" x-text="t.category"></td>
                                <td class="px-4 py-2">
                                    <div class="flex gap-1">
                                        <button x-show="t.status === 'failed' || t.status === 'queued'"
                                                @click="retryTask(t.id)" title="Retry"
                                                class="px-2 py-1 bg-blue-600 hover:bg-blue-700 rounded text-xs">&#8635;</button>
                                        <button x-show="t.status !== 'done' && t.status !== 'skipped'"
                                                @click="skipTask(t.id)" title="Skip"
                                                class="px-2 py-1 bg-gray-600 hover:bg-gray-500 rounded text-xs">&#9209;</button>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Batch Actions -->
            <div class="mt-3 flex gap-2" x-show="selectedTasks.length > 0">
                <span class="text-sm text-gray-400" x-text="`${selectedTasks.length} selected`"></span>
                <button @click="batchAction('dispatch')" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded text-xs">Dispatch</button>
                <button @click="batchAction('retry')" class="px-3 py-1 bg-yellow-600 hover:bg-yellow-700 rounded text-xs">Retry</button>
                <button @click="batchAction('skip')" class="px-3 py-1 bg-gray-600 hover:bg-gray-500 rounded text-xs">Skip</button>
            </div>
        </div>

        <!-- Servers View -->
        <div x-show="view === 'servers'" x-cloak>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="(srv, key) in (dashboard.servers || {})" :key="key">
                    <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full" :class="srv.worker_alive ? 'bg-green-400' : 'bg-red-400'"></span>
                                <span class="font-bold" x-text="key"></span>
                                <span class="text-xs text-gray-500" x-text="srv.host"></span>
                            </div>
                            <div class="flex items-center gap-2">
                                <button @click="restartWorker(key)" class="px-2 py-1 bg-orange-600 hover:bg-orange-700 rounded text-xs"
                                        x-show="!srv.worker_alive && !srv.local">
                                    Restart
                                </button>
                                <button @click="toggleServer(key)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs"
                                        x-show="!srv.local">
                                    <span x-text="expandedServer === key ? '▲ Collapse' : '▼ Queue'"></span>
                                </button>
                            </div>
                        </div>
                        <div class="space-y-1 text-sm">
                            <div class="flex justify-between">
                                <span class="text-gray-400">Worker</span>
                                <span :class="srv.worker_alive ? 'text-green-400' : 'text-red-400'"
                                      x-text="srv.local ? 'master' : (srv.worker_alive ? 'running' : 'dead')"></span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-400">Current</span>
                                <span class="text-gray-200 truncate max-w-[200px]" x-text="srv.current_task ? extractRepo(srv.current_task) : (srv.active_tasks?.length ? 'working...' : 'idle')"></span>
                            </div>
                            <div class="flex justify-between" x-show="getSpeed(key) > 0">
                                <span class="text-gray-400">Speed</span>
                                <span class="text-cyan-400" x-text="formatSpeed(getSpeed(key))"></span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-400">Active</span>
                                <span x-text="`${srv.active_tasks?.length || 0} tasks`"></span>
                            </div>
                            <div class="flex justify-between" x-show="srv.queue_depth > 0">
                                <span class="text-gray-400">Queued</span>
                                <span x-text="`${srv.queue_depth} in queue.txt`"></span>
                            </div>
                        </div>

                        <!-- Expandable Queue Section -->
                        <div x-show="expandedServer === key" class="mt-3 border-t border-gray-700 pt-3">
                            <div class="text-xs text-gray-400 mb-2 font-medium">Queue (drag to reorder):</div>
                            <template x-if="(serverQueues[key] || []).length === 0">
                                <div class="text-xs text-gray-500 italic py-2">Queue empty</div>
                            </template>
                            <div x-ref="queueList"
                                 x-init="$watch('expandedServer', v => { if (v === key) $nextTick(() => initSortable($refs.queueList, key)) })"
                                 class="space-y-1">
                                <template x-for="(item, idx) in (serverQueues[key] || [])" :key="item.line">
                                    <div :data-line="item.line"
                                         class="flex items-center gap-2 bg-gray-750 bg-gray-900/50 rounded px-2 py-1.5 border border-gray-700 hover:border-gray-500">
                                        <span class="drag-handle text-gray-500 hover:text-gray-300 select-none">&#9776;</span>
                                        <span class="text-xs text-gray-400 w-4" x-text="idx + 1"></span>
                                        <span class="text-sm text-gray-200 flex-1 truncate" x-text="item.display"></span>
                                        <span class="text-xs text-gray-500 truncate max-w-[120px]" x-text="item.repo_id" x-show="item.repo_id !== item.display"></span>
                                    </div>
                                </template>
                            </div>
                            <!-- Confirm / Cancel buttons (only show when dirty) -->
                            <div x-show="queueDirty[key]" class="mt-2 flex gap-2">
                                <button @click="saveQueueOrder(key)"
                                        class="px-3 py-1 bg-green-600 hover:bg-green-700 rounded text-xs font-medium">
                                    Confirm
                                </button>
                                <button @click="cancelQueueReorder(key)"
                                        class="px-3 py-1 bg-gray-600 hover:bg-gray-500 rounded text-xs">
                                    Cancel
                                </button>
                            </div>
                        </div>

                        <!-- Log button -->
                        <div class="mt-2 flex gap-3">
                            <button @click="viewLog(key)" class="text-xs text-blue-400 hover:text-blue-300" x-show="!srv.local">
                                View Log
                            </button>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Log Modal -->
            <div x-show="showLogModal" x-cloak class="fixed inset-0 bg-black/50 flex items-center justify-center z-50" @click.self="showLogModal = false">
                <div class="bg-gray-800 rounded-lg p-6 w-[700px] max-h-[80vh] overflow-auto">
                    <div class="flex justify-between mb-3">
                        <h3 class="font-bold" x-text="`Log: ${logServer}`"></h3>
                        <button @click="showLogModal = false" class="text-gray-400 hover:text-white">&times;</button>
                    </div>
                    <pre class="text-xs text-gray-300 font-mono whitespace-pre-wrap bg-gray-900 p-3 rounded max-h-[60vh] overflow-auto" x-text="logContent"></pre>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Add Task Modal -->
<div x-show="showAddModal" x-cloak class="fixed inset-0 bg-black/50 flex items-center justify-center z-50" @click.self="showAddModal = false">
    <div class="bg-gray-800 rounded-lg p-6 w-[500px]">
        <h3 class="font-bold mb-4">Add Download Task</h3>
        <div class="space-y-3">
            <div>
                <label class="text-xs text-gray-400">HuggingFace URL or repo_id</label>
                <input x-model="addForm.url" type="text" placeholder="org/repo or https://huggingface.co/..."
                       class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm mt-1"
                       @input.debounce.500ms="parseUrl()">
                <div x-show="addForm.parsed" class="text-xs text-green-400 mt-1" x-text="addForm.parsed?.repo_id ? `Parsed: ${addForm.parsed.repo_id} (${addForm.parsed.source})` : ''"></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-gray-400">Category</label>
                    <select x-model="addForm.category" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm mt-1">
                        <template x-for="c in categories" :key="c">
                            <option :value="c" x-text="c"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-gray-400">Priority</label>
                    <select x-model="addForm.priority" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm mt-1">
                        <option value="P0">P0 (Urgent)</option>
                        <option value="P1" selected>P1 (Normal)</option>
                        <option value="P2">P2 (Low)</option>
                        <option value="P3">P3 (Background)</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="text-xs text-gray-400">Type</label>
                <select x-model="addForm.type" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm mt-1">
                    <option value="dataset">Dataset</option>
                    <option value="model">Model</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <input type="checkbox" x-model="addForm.no_dispatch" id="no-dispatch">
                <label for="no-dispatch" class="text-xs text-gray-400">Only queue (don't dispatch)</label>
            </div>
        </div>
        <div class="flex justify-end gap-2 mt-4">
            <button @click="showAddModal = false" class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded text-sm">Cancel</button>
            <button @click="submitAdd()" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded text-sm" :disabled="!addForm.url">Add & Dispatch</button>
        </div>
        <div x-show="addForm.error" class="mt-2 text-xs text-red-400" x-text="addForm.error"></div>
    </div>
</div>

<!-- Toast -->
<div x-show="toast.show" x-cloak
     class="fixed bottom-4 right-4 px-4 py-2 rounded shadow-lg text-sm z-50"
     :class="toast.type === 'error' ? 'bg-red-600' : 'bg-green-600'"
     x-text="toast.message"
     x-transition>
</div>

<script src="app.js"></script>
</body>
</html>
